<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="衣橱">
<meta name="application-name" content="我的衣橱">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>我的衣橱</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --text2:#8e8e93; --sep:rgba(60,60,67,.14);
  --ink:#1c1c1e; --tint:#a8724a; --danger:#ff3b30;
  --safe-top:max(env(safe-area-inset-top),12px); --safe-bottom:max(env(safe-area-inset-bottom),8px); --tabh:calc(52px + var(--safe-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  overflow:hidden;background:#e9e5e0;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit}
#device{width:100%;max-width:520px;height:100vh;height:100dvh;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}
#screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;overflow-y:auto;padding-top:var(--safe-top);padding-bottom:calc(var(--tabh) + 16px);display:none;scrollbar-width:none}
.page.active{display:block}
.page::-webkit-scrollbar,.body::-webkit-scrollbar,.frow::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.largehead{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 20px 4px}
.largehead h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.3px}
.sub{color:var(--text2);font-size:13px;padding:0 20px 8px}
.iconbtn{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:rgba(120,120,128,.12)}
.iconbtn svg{width:20px;height:20px}
/* filters */
.filters{padding:4px 0 2px}
.frow{display:flex;gap:7px;overflow-x:auto;padding:4px 16px;align-items:center;scrollbar-width:none}
.flabel{flex:none;font-size:12px;color:var(--text2);width:30px}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:16px;background:var(--card);font-size:13px;border:1px solid var(--sep);white-space:nowrap;transition:background .15s,color .15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dot.gold{background:linear-gradient(135deg,#fff3b0 0%,#e2bf4a 35%,#a8811f 65%,#f3dc7c 100%)}
.dot.silver{background:linear-gradient(135deg,#ffffff 0%,#c9cdd4 35%,#8a9099 65%,#eef0f3 100%)}
.dot.floral{background:conic-gradient(#e2798d 0 25%,#f0a53a 0 50%,#5e8d5a 0 75%,#8d6bb8 0)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative;text-align:left;width:100%}
.ph{aspect-ratio:3/4;background:#f4f2ee;display:block}
.ph img,.thumb img,.refimg img,.hero img{width:100%;height:100%;object-fit:contain;display:block}
.card .nm{font-size:12px;font-weight:500;padding:6px 8px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:10.5px;color:var(--text2);padding:0 8px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .check{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;border:2px solid #fff;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:#fff}
.card.sel{box-shadow:0 0 0 2.5px var(--ink)}
.card.sel .check{background:var(--ink)}
.card .check svg{width:14px;height:14px;opacity:0}
.card.sel .check svg{opacity:1}
.empty{text-align:center;color:var(--text2);font-size:14px;padding:50px 30px;line-height:1.7}
.foot{text-align:center;color:var(--text2);font-size:11px;padding:18px 30px 6px;line-height:1.6}
/* outfit list */
.ocard{display:flex;gap:12px;background:var(--card);border-radius:18px;margin:0 16px 12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);width:calc(100% - 32px);text-align:left}
.ocard .cover{width:92px;height:122px;border-radius:12px;overflow:hidden;flex:none;background:#f4f2ee;position:relative}
.ocard .cover img{width:100%;height:100%;object-fit:cover}
.ocard .cover .badge{position:absolute;left:5px;top:5px;font-size:9.5px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:8px}
.ocard .info{flex:1;min-width:0;display:flex;flex-direction:column}
.ocard h3{margin:2px 0 3px;font-size:16px;font-weight:600}
.ocard .by{font-size:12.5px;color:var(--tint)}
.ocard .pieces{display:flex;gap:5px;margin-top:auto}
.thumb{width:42px;height:56px;border-radius:8px;background:#f4f2ee;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#f2f0ec;color:#5a5048;display:inline-flex;align-items:center;gap:4px}
/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);padding-bottom:var(--safe-bottom);z-index:60;display:flex;align-items:center;justify-content:space-around;background:rgba(249,249,249,.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#999;width:80px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--ink)}
.plus{width:52px;height:52px;border-radius:26px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25);margin-top:-14px}
.plus svg{width:26px;height:26px}
/* stacked views */
#stack .view{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .34s cubic-bezier(.3,.75,.2,1);box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#stack .view.in{transform:none}
.nav{flex:none;padding-top:var(--safe-top);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(44px + var(--safe-top));background:rgba(242,242,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);padding-left:8px;padding-right:16px}
.nav .t{font-size:17px;font-weight:600;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .l{justify-self:start;display:flex;align-items:center;color:var(--tint);font-size:17px}
.nav .l svg{width:22px;height:22px}
.nav .r{justify-self:end;color:var(--tint);font-size:17px}
.nav .r.b{font-weight:600}
.nav .r:disabled{opacity:.35}
.body{flex:1;overflow-y:auto;padding-bottom:calc(var(--tabh) + 24px);scrollbar-width:none}
.hero{margin:14px 16px 0;border-radius:20px;overflow:hidden;background:#f4f2ee;aspect-ratio:4/5;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dtitle{font-size:24px;font-weight:700;margin:16px 20px 2px}
.dsub{font-size:13px;color:var(--text2);margin:0 20px 12px}
.glabel{font-size:13px;color:var(--text2);margin:18px 32px 6px;display:flex;justify-content:space-between}
.group{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 16px;min-height:44px;border-bottom:.5px solid var(--sep);font-size:15px}
.row:last-child{border-bottom:0}
.row .k{color:var(--text2);width:44px;flex:none;font-size:14px}
.row .v{display:flex;gap:6px;flex-wrap:wrap}
.btn-danger{display:block;width:calc(100% - 32px);margin:22px 16px 0;padding:13px;border-radius:12px;background:var(--card);color:var(--danger);font-size:16px;text-align:center}
.mini{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--sep);width:100%;text-align:left}
.mini:last-child{border-bottom:0}
.mini .thumb{width:38px;height:50px}
.mini .tx{flex:1;min-width:0}
.mini .tx b{font-weight:500;font-size:15px;display:block}
.mini .tx small{color:var(--text2);font-size:12px}
.chev{color:#c4c4c7;font-size:18px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.refimg{flex:none;border-radius:16px;overflow:hidden;background:#eee;scroll-snap-align:start;aspect-ratio:3/4;position:relative}
.refimg img{object-fit:cover}
.refimg .lb{position:absolute;left:8px;top:8px;font-size:10.5px;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refimg .lb.self{background:rgba(168,114,74,.92)}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;margin:12px 16px 0}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px;font-weight:500}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.side .col{display:flex;flex-direction:column;gap:10px}
.side .grid{padding:0;grid-template-columns:1fr 1fr;gap:8px}
.pair2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.pair2 .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.pair2 .glabel{margin:18px 4px 0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.by-line{font-size:14px;color:var(--tint);margin:8px 20px 0}
/* sheets */
.sheet-wrap{position:absolute;inset:0;z-index:120;background:rgba(0,0,0,0);transition:background .3s}
.sheet-wrap.on{background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--safe-top) + 6px);background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .36s cubic-bezier(.3,.75,.2,1);overflow:hidden}
.sheet-wrap.on .sheet{transform:none}
.sheet .nav{padding-top:0;height:56px;border-radius:14px 14px 0 0;padding-left:16px}
.sheet .body{padding-bottom:40px}
.field{display:block;width:100%;border:0;outline:0;padding:12px 16px;font-size:16px;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:12px 14px}
.photo{margin:14px 16px 0;border-radius:18px;overflow:hidden;background:#ebe8e3;aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain}
.photo .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#7d746b}
.pbtns{display:flex;gap:10px;margin:12px 16px 0}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border-radius:12px;background:var(--card);font-size:14px;font-weight:500;cursor:pointer}
.pbtn svg{width:20px;height:20px}
.pbtn.dark{background:var(--ink);color:#fff}
.refs{display:flex;gap:10px;overflow-x:auto;padding:12px 14px}
.refs .rt{flex:none;width:84px;height:112px;border-radius:12px;overflow:hidden;position:relative;background:#eee}
.refs .rt img{width:100%;height:100%;object-fit:cover}
.refs .rt .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:22px;text-align:center}
.refs .add{flex:none;width:84px;height:112px;border-radius:12px;border:1.5px dashed #c7c2bb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text2);font-size:11.5px;cursor:pointer;text-align:center}
.refs .add svg{width:24px;height:24px}
.picker .grid{padding:6px 12px 12px;gap:8px}
.picker .filters{padding-top:8px}
.picker .frow{padding:3px 12px}
/* action sheet */
.as-wrap{position:absolute;inset:0;z-index:150;background:rgba(0,0,0,0);transition:background .25s;display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px calc(var(--safe-bottom) + 4px)}
.as-wrap.on{background:rgba(0,0,0,.35)}
.as{transform:translateY(120%);transition:transform .3s cubic-bezier(.3,.75,.2,1)}
.as-wrap.on .as{transform:none}
.as .grp{background:rgba(250,250,250,.96);border-radius:14px;overflow:hidden;margin-bottom:8px}
.as .ttl{padding:14px 16px;font-size:13px;color:var(--text2);text-align:center;border-bottom:.5px solid var(--sep);line-height:1.5}
.as button{display:block;width:100%;padding:17px;font-size:19px;color:#007aff;border-bottom:.5px solid var(--sep)}
.as button:last-child{border-bottom:0}
.as button.d{color:var(--danger)}
.as button.c{font-weight:600}
/* item detail v2 */
.ihead{display:flex;gap:14px;margin:14px 16px 0;background:var(--card);border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ihead .ph{width:112px;flex:none;border-radius:12px;overflow:hidden}
.ihead .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ihead h2{margin:2px 0 0;font-size:20px;font-weight:700;line-height:1.3}
.ihead .dt{font-size:12px;color:var(--text2)}
.ihead .tl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.ihead .tl b{font-weight:400;width:28px}
.ihead .uses{margin-top:auto;font-size:12.5px;color:var(--tint);font-weight:500}
.cta{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 16px 0;padding:13px;border-radius:14px;background:var(--ink);color:#fff;font-size:15.5px;font-weight:600;width:calc(100% - 32px)}
.cta svg{width:20px;height:20px}
.cta.light{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sec{margin:24px 20px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:20px;margin:0;font-weight:700}
.sec small{color:var(--text2);font-size:12.5px}
.demo-row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.demo-row::-webkit-scrollbar,.prow::-webkit-scrollbar{display:none}
.demo{flex:none;width:236px;background:var(--card);border-radius:18px;overflow:hidden;scroll-snap-align:start;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.demo.only{width:100%}
.demo .di{aspect-ratio:3/4;position:relative;background:#eee;display:block}
.demo.only .di{aspect-ratio:4/4}
.demo .di img{width:100%;height:100%;object-fit:cover;display:block}
.sbadge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:10px;color:#fff;background:rgba(28,28,30,.72);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{position:absolute;left:5px;top:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:calc(100% - 10px)}
.badges .sbadge{position:static;max-width:100%}
.ocard .cover .sbadge{font-size:9.5px;padding:2px 6px}
.sbadge.self{background:rgba(168,114,74,.92)}
.demo .more{position:absolute;right:8px;top:8px;font-size:11px;padding:3px 7px;border-radius:10px;background:rgba(255,255,255,.85);color:#5a5048}
.demo .dn{padding:10px 12px 6px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo .dp{display:flex;align-items:center;gap:5px;padding:0 12px 12px;font-size:11.5px;color:var(--text2)}
.demo .dp .thumb{width:32px;height:43px;border-radius:7px}
.emptybox{margin:0 16px;background:var(--card);border-radius:18px;padding:22px 18px;text-align:center;color:var(--text2);font-size:14px;line-height:1.7}
.emptybox .cta{margin:14px 0 0;width:100%}
.pcat{font-size:13px;color:var(--text2);margin:12px 20px 6px;font-weight:500}
.prow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 16px}
.pitem .ph{aspect-ratio:1/1}
.pcat{margin-top:10px!important}
.pitem{min-width:0;text-align:left}
.pitem .ph{border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pitem .nm{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .ct{font-size:11px;color:var(--tint)}
.card .cnt{position:absolute;left:5px;top:5px;font-size:9.5px;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.9);color:#7a5a40;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* duplicate check */
.dup{margin:18px 16px 0;border-radius:14px;padding:12px 14px;background:#fff6ea;border:1px solid #f0dcc0}
.dup.none{background:#eef6ee;border-color:#d3e7d3;color:#3f6b3f;font-size:13.5px;padding:11px 14px}
.dup h4{margin:0 0 2px;font-size:14.5px;color:#8a5a2b;font-weight:600}
.dup p{margin:0 0 10px;font-size:12px;color:#a07a55}
.dup .dl{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.dup .di2{flex:none;width:72px;text-align:left}
.dup .di2 .ph{border-radius:10px;overflow:hidden;background:#fff}
.dup .di2 .nm{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.peek{background:var(--card);border-radius:20px;overflow:hidden;margin:0 8px 8px;transform:translateY(120%);transition:transform .3s cubic-bezier(.3,.75,.2,1)}
.as-wrap.on .peek{transform:none}
.peek .ph{aspect-ratio:1/1;max-height:300px;width:100%}
.peek .pi{padding:14px 16px 6px}
.peek h3{margin:0 0 6px;font-size:18px}
.peek .pn{font-size:12.5px;color:var(--text2);padding:2px 16px 14px}
.remind{margin:4px 16px 8px;padding:11px 12px 11px 14px;border-radius:14px;background:#fff6ea;border:1px solid #f0dcc0;font-size:13px;color:#7a5530;line-height:1.5;display:flex;gap:10px;align-items:center}
.remind .tx{flex:1}
.remind button{flex:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--ink);color:#fff}
.remind button.later{background:transparent;color:#a07a55;font-weight:500;padding:6px 4px}
.empty-actions{display:flex;flex-direction:column;gap:0;margin-top:-20px}
.fatal{padding:80px 30px;text-align:center;color:var(--text2);line-height:1.8}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.9);background:rgba(30,30,30,.85);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;z-index:300;opacity:0;transition:all .2s;pointer-events:none;max-width:260px;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div id="device">
  <div id="screen">
    <section class="page active" id="page-wardrobe"></section>
    <section class="page" id="page-outfits"></section>
    <div id="stack"></div>

    <nav class="tabbar">
      <button class="tab on" data-act="tab" data-v="wardrobe" id="tab-wardrobe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6.2a2 2 0 1 1 2.6 1.9c-.4.1-.6.5-.6.9v.8"/><path d="M12 9.8 3.2 15.9c-.9.6-.5 2.1.6 2.1h16.4c1.1 0 1.5-1.5.6-2.1L12 9.8z"/></svg>
        <span>衣橱</span></button>
      <button class="plus" data-act="plus" aria-label="新建">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tab" data-act="tab" data-v="outfits" id="tab-outfits">

/* ---------- IndexedDB storage (photos stored as compressed JPEG data URLs inside records) ---------- */
const Store = {
  idb:null,
  open(){
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('此浏览器不支持本地数据库'));
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => { const d = r.result;
        if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', { keyPath:'id' });
        if (!d.objectStoreNames.contains('outfits')) d.createObjectStore('outfits', { keyPath:'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
      r.onsuccess = () => { this.idb = r.result; this.idb.onversionchange = () => this.idb.close(); resolve(); };

      r.onblocked = () => reject(new Error('数据库被占用，请关闭其他打开的衣橱页面后重试'));
    });
  },
  tx(stores, mode, fn){
    return new Promise((resolve, reject) => {
      const t = this.idb.transaction(stores, mode); let out;
      try { out = fn(t); } catch (e) { try { t.abort(); } catch (_) {} return reject(e); }
      t.oncomplete = () => resolve(out); t.onerror = () => reject(t.error); t.onabort = () => reject(t.error || new Error('写入被中止'));
    });
  },
  getAll(store){
    return new Promise((resolve, reject) => { const r = this.idb.transaction(store).objectStore(store).getAll(); r.onsuccess = () => resolve(r.result || []); r.onerror = () => reject(r.error); });
  },
  getMeta(){
    return new Promise((resolve, reject) => { const out = {}; const r = this.idb.transaction('meta').objectStore('meta').openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else resolve(out); }; r.onerror = () => reject(r.error); });
  },
  setMeta(k, v){ meta[k] = v; return this.tx(['meta'], 'readwrite', t => t.objectStore('meta').put(v, k)); },
  apply(ch){ // ch: {items:[], outfits:[], delItems:[ids], delOutfits:[ids]}
    return this.tx(['items', 'outfits'], 'readwrite', t => {
      const I = t.objectStore('items'), O = t.objectStore('outfits');
      (ch.items || []).forEach(x => I.put(x)); (ch.outfits || []).forEach(x => O.put(x));
      (ch.delItems || []).forEach(id => I.delete(id)); (ch.delOutfits || []).forEach(id => O.delete(id));
    });
  },
  replaceAll(items, outfits){
    return this.tx(['items', 'outfits'], 'readwrite', t => {

function storageError(e){

  console.error(e);
}

function normalizeData(data){
  const items = (data.items || []).filter(x => x && x.id && x.cat && x.img).map(x => Object.assign({ seasons:[], name:'', color:'' }, x, { seasons:Array.isArray(x.seasons) ? x.seasons : [] }));
  const ids = new Set(items.map(x => x.id));
  const outfits = (data.outfits || []).filter(o => o && o.id).map(o => {
    const photos = Array.isArray(o.photos) ? o.photos.filter(p => p && p.img).map(p => ({ src:p.src === 'self' ? 'self' : 'blogger', img:p.img }))
      : (o.refs || []).map(img => ({ src:o.src === 'self' ? 'self' : 'blogger', img }));
    const out = Object.assign({}, o, { photos, blogger:o.blogger || '', itemIds:(o.itemIds || []).filter(id => ids.has(id)), createdAt:o.createdAt || Date.now() });
    delete out.refs; delete out.src; return out;

    try { const s = JSON.parse(localStorage.getItem(k)); if (s && Array.isArray(s.items) && (s.items.length || (s.outfits || []).length)) return { key:k, data:normalizeData(s) }; } catch (e) {}

}
async function init(){

  const [items, outfits, m] = await Promise.all([Store.getAll('items'), Store.getAll('outfits'), Store.getMeta()]);

    const legacy = !db.items.length && !db.outfits.length ? readLegacy() : null;
    if (legacy) {
      try { await Store.replaceAll(legacy.data.items, legacy.data.outfits); db = legacy.data; LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); setTimeout(() => toast('已从旧版本迁移 ' + db.items.length + ' 件衣物'), 300); }
      catch (e) { storageError(e); }
    }

}

const sPhotos = o => o.photos.filter(p => p.src === 'self');
const coverPhoto = o => bPhotos(o)[0] || sPhotos(o)[0] || null; // prefer blogger
const pLabel = (o, p) => p.src === 'self' ? '我的穿搭' : ('博主' + (o.blogger ? '·' + o.blogger : '示范'));
const pBadge = (o, p, extra) => '<span class="sbadge' + (p.src === 'self' ? ' self' : '') + '">' + esc(pLabel(o, p)) + (extra || '') + '</span>';
const srcBadges = o => { const b = bPhotos(o), m = sPhotos(o); return (b.length ? pBadge(o, b[0], b.length > 1 ? ' ×' + b.length : '') : '') + (m.length ? pBadge(o, m[0], m.length > 1 ? ' ×' + m.length : '') : ''); };
const srcText = o => { const b = bPhotos(o).length, m = sPhotos(o).length, t = [];
  if (b) t.push(o.blogger ? '博主 @' + esc(o.blogger) : '博主示范'); if (m) t.push('我的穿搭照片'); return t.join(' · '); };

/* ---------- ui state ---------- */
const newFilter = () => ({ cat:new Set(), season:new Set(), color:new Set() });
const ui = { tab:'wardrobe', wf:newFilter(), stack:[], draft:null, odLayout:'stack' };
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => { const d = new Date(ts); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const sortSeasons = a => SEASONS.filter(s => a.includes(s));
function outfitSeasons(items){
  const main = items.filter(i => i.cat !== '配饰');
  const relevant = main.length ? main : items;
  return relevant.length ? SEASONS.filter(s => relevant.every(i => i.seasons.includes(s))) : [];
}
function applyFilter(items, f){
  return items.filter(it => (!f.cat.size || f.cat.has(it.cat)) && (!f.season.size || it.seasons.some(s => f.season.has(s))) && (!f.color.size || f.color.has(it.color)));
}
function dotHTML(color){ return color === '金色' ? '<i class="dot gold"></i>' : color === '银色' ? '<i class="dot silver"></i>' : color === '花色' ? '<i class="dot floral"></i>' : '<i class="dot" style="background:' + colorHex(color) + '"></i>'; }
function filtersHTML(f, scope){
  const row = (label, dim, vals, isColor) =>
    '<div class="frow"><span class="flabel">' + label + '</span>' +
    '<button class="chip' + (f[dim].size ? '' : ' on') + '" data-act="filter" data-scope="' + scope + '" data-dim="' + dim + '" data-v="">全部</button>' +
    vals.map(v => '<button class="chip' + (f[dim].has(v) ? ' on' : '') + '" data-act="filter" data-scope="' + scope + '" data-dim="' + dim + '" data-v="' + esc(v) + '">' + (isColor ? dotHTML(v) : '') + esc(v) + '</button>').join('') + '</div>';
  return '<div class="filters">' + row('品类', 'cat', CATS) + row('季节', 'season', SEASONS) + row('色系', 'color', COLORS.map(c => c[0]), true) + '</div>';
}
function itemCard(it, opts){
  opts = opts || {};
  return '<button class="card' + (opts.sel ? ' sel' : '') + '" data-act="' + (opts.act || 'openItem') + '" data-id="' + it.id + '">' +
    '<span class="ph"><img src="' + it.img + '" alt="" loading="lazy"></span>' +
    (!opts.pick && !opts.noCount && (opts.n = outfitsWith(it.id).length) ? '<span class="cnt">' + opts.n + '套搭配</span>' : '') +
    '<div class="nm">' + esc(it.name) + '</div><div class="mt">' + esc(it.cat) + ' · ' + sortSeasons(it.seasons).join('') + '</div>' +
    (opts.pick ? '<span class="check">' + I.check + '</span>' : '') + '</button>';
}

/* ---------- pages ---------- */
function renderWardrobe(){
  const list = applyFilter(db.items, ui.wf).sort((a, b) => b.createdAt - a.createdAt);
  const any = ui.wf.cat.size || ui.wf.season.size || ui.wf.color.size;
  $('#page-wardrobe').innerHTML =
    '<div class="largehead"><h1>衣橱</h1><button class="iconbtn" data-act="settings" aria-label="更多">' + I.more + '</button></div>' +
    '<div class="sub">共 ' + db.items.length + ' 件' + (any ? ' · 筛选出 ' + list.length + ' 件' : '') + '</div>' +
    todayEntryHTML() + reminderHTML() +
    (db.items.length ? filtersHTML(ui.wf, 'w') : '') +
    (list.length ? '<div class="grid">' + list.map(it => itemCard(it)).join('') + '</div>'
      : db.items.length ? '<div class="empty">没有符合条件的衣物<br>试试调整筛选</div>'
      : '<div class="empty">衣橱还是空的<br>拍下或导入已买的衣服、鞋子和配饰，开始整理吧</div><div class="empty-actions"><button class="cta" data-act="addItem">' + I.plus + '添加第一件衣物</button><button class="cta light" data-act="loadSample">先载入示例数据看看</button></div>') +

function outfitCard(o){
  const items = o.itemIds.map(getItem).filter(Boolean);

    '<div class="pieces">' + items.slice(0, 4).map(i => '<span class="thumb"><img src="' + i.img + '" alt=""></span>').join('') +

function renderOutfits(){
  const list = db.outfits.slice().sort((a, b) => b.createdAt - a.createdAt);

    (list.length ? list.map(outfitCard).join('') : '<div class="empty">还没有搭配<br>' + (db.items.length ? '点击下方 ＋ 新建搭配，附上博主示范或自己的穿搭照片' : '先在衣橱里添加衣物，再来组合搭配') + '</div>');

function renderPages(){
  renderWardrobe(); renderOutfits();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + ui.tab));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === ui.tab));
}

/* ---------- detail views (push) ---------- */
function itemDetailHTML(it){
  const used = outfitsWith(it.id);
  // 可搭配单品: other items sharing an outfit with this one
  const pair = {};
  used.forEach(o => o.itemIds.forEach(x => { if (x !== it.id && getItem(x)) pair[x] = (pair[x] || 0) + 1; }));
  const pairItems = Object.keys(pair).map(getItem).sort((a, b) => pair[b.id] - pair[a.id] || a.name.localeCompare(b.name));
  const demoCard = o => {
    const others = o.itemIds.filter(x => x !== it.id).map(getItem).filter(Boolean);
    const cp = coverPhoto(o), cov = cp ? cp.img : it.img, both = bPhotos(o).length && sPhotos(o).length;
    return '<button class="demo' + (used.length === 1 ? ' only' : '') + '" data-act="openOutfit" data-id="' + o.id + '">' +
      '<span class="di"><img src="' + cov + '" alt="">' + (cp ? pBadge(o, cp) : '') + (both ? '<span class="more">+我的穿搭</span>' : o.photos.length > 1 ? '<span class="more">' + o.photos.length + '张</span>' : '') + '</span>' +
      '<div class="dn">' + esc(o.name) + '</div>' +
      '<div class="dp">' + (others.length ? '搭配 ' + others.slice(0, 4).map(i => '<span class="thumb"><img src="' + i.img + '" alt=""></span>').join('') + (others.length > 4 ? '<span>+' + (others.length - 4) + '</span>' : '') : '仅这一件') + '</div></button>';
  };
  const byCat = CATS.map(c => [c, pairItems.filter(i => i.cat === c)]).filter(g => g[1].length);
  return '<div class="nav"><button class="l" data-act="back">' + I.back + '返回</button><div class="t">' + esc(it.name) + '</div><button class="r" data-act="editItem" data-id="' + it.id + '">编辑</button></div>' +
    '<div class="body">' +
    '<div class="ihead"><span class="ph"><img src="' + it.img + '" alt=""></span><div class="inf">' +
      '<h2>' + esc(it.name) + '</h2>' +
      '<div class="tl"><b>品类</b><span class="tag">' + esc(it.cat) + '</span></div>' +
      '<div class="tl"><b>季节</b>' + sortSeasons(it.seasons).map(s => '<span class="tag">' + s + '</span>').join('') + '</div>' +
      '<div class="tl"><b>色系</b><span class="tag">' + dotHTML(it.color) + esc(it.color) + '</span></div>' +
      '<div class="uses">' + (used.length ? '已有 ' + used.length + ' 套搭配 · 可搭 ' + pairItems.length + ' 件单品' : '还没有搭配') + '</div>' +
    '</div></div>' +
    '<div class="sec"><h2>搭配示范</h2><small>这件怎么穿' + (used.length > 1 ? ' · 左右滑动' : '') + '</small></div>' +
    (used.length ? '<div class="demo-row">' + used.map(demoCard).join('') + '</div>'
      : '<div class="emptybox">还没有用到这件的搭配<br>照着博主示范或自己的穿搭照片记一套吧</div>') +
    '<button class="cta" data-act="newOutfitWith" data-id="' + it.id + '">' + I.plus + '用这件新建搭配</button>' +
    '<div class="sec"><h2>可搭配单品</h2><small>' + (pairItems.length ? pairItems.length + ' 件 · 来自已有搭配' : '') + '</small></div>' +
    (byCat.length ? byCat.map(g => '<div class="pcat">' + g[0] + ' · ' + g[1].length + '</div><div class="prow">' +
        g[1].map(p => '<button class="pitem" data-act="openItem" data-id="' + p.id + '"><span class="ph"><img src="' + p.img + '" alt=""></span><div class="nm">' + esc(p.name) + '</div><div class="ct">同搭 ' + pair[p.id] + ' 套</div></button>').join('') + '</div>').join('')
      : '<div class="emptybox">加入搭配后，这里会列出和它一起穿过的单品</div>') +
    '<div class="foot">添加于 ' + fmtDate(it.createdAt) + '</div>' +
    '<button class="btn-danger" data-act="delItem" data-id="' + it.id + '">删除这件衣物</button>' +
    '</div>';
}
function outfitDetailHTML(o){
  const items = o.itemIds.map(getItem).filter(Boolean);
  const seasons = outfitSeasons(items);
  const groups = [['blogger', '博主示范图' + (o.blogger ? ' · @' + esc(o.blogger) : ''), bPhotos(o)], ['self', '我的穿搭照片', sPhotos(o)]].filter(g => g[2].length);
  const pimg = (p, i, n, w) => '<div class="refimg" style="width:' + w + '"><img src="' + p.img + '" alt=""><span class="lb' + (p.src === 'self' ? ' self' : '') + '">' + esc(pLabel(o, p)) + (n > 1 ? ' ' + (i + 1) : '') + '</span></div>';
  const refsStack = groups.length === 2 // both kinds: side-by-side columns, each labeled
    ? '<div class="pair2">' + groups.map(g => '<div class="col"><div class="glabel">' + g[1] + '</div>' + g[2].map((p, i) => pimg(p, i, g[2].length, '100%')).join('') + '</div>').join('') + '</div>'
    : groups.length ? groups.map(g => '<div class="glabel"><span>' + g[1] + '</span><span>' + (g[2].length > 2 ? '左右滑动查看' : '') + '</span></div>' +
      '<div class="hscroll">' + g[2].map((p, i) => pimg(p, i, g[2].length, g[2].length === 1 ? '78%' : 'calc(50% - 5px)')).join('') + '</div>').join('')
    : '<div class="empty" style="padding:20px">未添加示范图</div>';
  const piecesGrid = cols => '<div class="grid"' + (cols ? ' style="grid-template-columns:repeat(' + cols + ',1fr)"' : '') + '>' + items.map(i => itemCard(i)).join('') + '</div>';
  let main;
  if (ui.odLayout === 'side') {
    main = '<div class="glabel"><span>示范图</span><span>我的单品 · ' + items.length + ' 件</span></div>' +

      '<div class="col">' + piecesGrid(2) + '</div></div>';
  } else {
    main = refsStack +
      '<div class="glabel"><span>我的单品 · ' + items.length + ' 件</span></div>' + piecesGrid();
  }
  return '<div class="nav"><button class="l" data-act="back">' + I.back + '返回</button><div class="t">' + esc(o.name) + '</div><button class="r" data-act="editOutfit" data-id="' + o.id + '">编辑</button></div>' +
    '<div class="body">' +
    '<div class="dtitle">' + esc(o.name) + '</div>' +
    '<div class="dsub">' + (o.photos.length ? srcText(o) + ' · ' : '') + (seasons.length ? '适合 ' + seasons.join(' / ') + ' · ' : '季节待确认 · ') + '创建于 ' + fmtDate(o.createdAt) + '</div>' +
    '<div class="seg"><button class="' + (ui.odLayout === 'stack' ? 'on' : '') + '" data-act="odLayout" data-v="stack">上下对照</button><button class="' + (ui.odLayout === 'side' ? 'on' : '') + '" data-act="odLayout" data-v="side">左右并排</button></div>' +

    '<button class="btn-danger" data-act="delOutfit" data-id="' + o.id + '">删除这套搭配</button>' +
    '</div>';
}

/* ---------- today's saved outfit ---------- */
const today = { season:'', id:null };
function todayEntryHTML(){
  return '<button class="cta" style="margin-bottom:14px;background:#a8724a" data-act="today">今天穿什么 · 随机选一套</button>';
}
function todayCandidates(){
  return db.outfits.filter(o => o.itemIds.length && o.itemIds.every(id => !!getItem(id)) &&
    (!today.season || outfitSeasons(o.itemIds.map(getItem)).includes(today.season)));
}
function pickToday(){
  const choices = todayCandidates();
  const next = choices.length > 1 ? choices.filter(o => o.id !== today.id) : choices;
  today.id = next.length ? next[Math.floor(Math.random() * next.length)].id : null;
}
function todayHTML(){
  const choices = todayCandidates(), o = choices.find(o => o.id === today.id);
  return '<div class="nav"><button class="l" data-act="back">' + I.back + '返回</button><div class="t">今天穿什么</div></div><div class="body">' +
    '<h2 class="dtitle">给今天一点灵感</h2><p class="dsub">从你保存过的搭配中随机挑选，不会自动新增搭配。</p>' +
    '<div class="frow" style="margin-bottom:16px">' + ['', ...SEASONS].map(s => '<button class="chip' + (today.season === s ? ' on' : '') + '" data-act="todaySeason" data-v="' + s + '" aria-pressed="' + (today.season === s) + '">' + (s || '全部季节') + '</button>').join('') + '</div>' +
    '<div aria-live="polite">' + (o ? '<p class="dsub">这套怎么样？ · ' + choices.length + ' 套可选</p>' + outfitCard(o) +
      (choices.length > 1 ? '<button class="cta" data-act="todayAgain">换一套</button>' : '<p class="foot">目前只有这一套符合条件，可切换季节或添加更多搭配。</p>') +
      '<button class="cta light" data-act="openOutfit" data-id="' + esc(o.id) + '">查看这套搭配</button>' +
      '<div class="grid">' + o.itemIds.map(getItem).map(i => itemCard(i)).join('') + '</div>' :
      '<div class="emptybox">' + (db.outfits.length ? '这个季节暂无可选搭配，试试「全部季节」。' : '还没有保存搭配。先把喜欢的穿法存下来，下次就能帮你随机选。') + '</div>') + '</div></div>';
}

function renderView(entry){
  const s = entry.spec;
  if (s.type === 'today') { if (!todayCandidates().some(o => o.id === today.id)) pickToday(); entry.el.innerHTML = todayHTML(); }
  else if (s.type === 'item') { const it = getItem(s.id); if (!it) return false; entry.el.innerHTML = itemDetailHTML(it); }
  else if (s.type === 'outfit') { const o = getOutfit(s.id); if (!o) return false; entry.el.innerHTML = outfitDetailHTML(o); }
  return true;
}
function push(spec){
  const el = document.createElement('div'); el.className = 'view';
  $('#stack').appendChild(el);
  const entry = { el, spec }; ui.stack.push(entry); renderView(entry);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
}
function pop(){
  const e = ui.stack.pop(); if (!e) return;
  e.el.classList.remove('in'); setTimeout(() => e.el.remove(), 360);
}
function clearStack(){ ui.stack.forEach(e => e.el.remove()); ui.stack = []; }
function refresh(){
  renderPages();
  ui.stack = ui.stack.filter(e => { if (renderView(e) === false) { e.el.classList.remove('in'); setTimeout(() => e.el.remove(), 360); return false; } return true; });
}

/* ---------- sheets ---------- */
function openSheet(html){
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = '<div class="sheet">' + html + '</div>';
  $('#sheetroot').appendChild(w);
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('on')));
  return w;
}
function closeSheet(){
  const w = $('#sheetroot .sheet-wrap:last-child'); if (!w) return;
  w.classList.remove('on'); setTimeout(() => w.remove(), 380); ui.draft = null;
}
let asHandlers = [];
function actionSheet(title, actions){
  asHandlers = actions;
  const w = document.createElement('div'); w.className = 'as-wrap'; w.dataset.act = 'asCancel';
  w.innerHTML = '<div class="as"><div class="grp">' + (title ? '<div class="ttl">' + title + '</div>' : '') +
    actions.map((a, i) => '<button class="' + (a.danger ? 'd' : '') + '" data-act="asPick" data-i="' + i + '">' + esc(a.label) + '</button>').join('') +
    '</div><div class="grp"><button class="c" data-act="asCancel">取消</button></div></div>';
  $('#asroot').appendChild(w);
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('on')));
}
function closeAS(){ const w = $('#asroot .as-wrap'); if (!w) return; w.classList.remove('on'); setTimeout(() => w.remove(), 300); }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- item editor ---------- */
function chipsPick(field, vals, cur, multi, isColor){

    const on = multi ? cur.includes(v) : cur === v;

// 防重复：同品类 + 同色系的已有衣物（编辑时排除自己）
function updateDup(){
  const d = ui.draft, box = $('#dupPanel'); if (!d || !box) return;
  if (!d.cat || !d.color) { box.innerHTML = ''; return; }
  const same = db.items.filter(x => x.cat === d.cat && x.color === d.color && x.id !== d.id).sort((a, b) => b.createdAt - a.createdAt);
  const was = box.innerHTML;
  box.innerHTML = same.length

/* ---------- image reading (camera photos -> max 1200px JPEG) ---------- */
function readImage(file, max){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => reject(new Error('无法读取该图片'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    case 'todaySeason': today.season = el.dataset.v; pickToday(); refresh(); break;
    case 'tab': ui.tab = el.dataset.v; clearStack(); renderPages(); $('#page-' + ui.tab).scrollTop = 0; break;
    case 'filter': {
      const f = el.dataset.scope === 'w' ? ui.wf : ui.draft.pf, dim = el.dataset.dim, v = el.dataset.v;
      if (!v) f[dim].clear(); else f[dim].has(v) ? f[dim].delete(v) : f[dim].add(v);

      else { const sl = [...document.querySelectorAll('#pickFilters .frow')].map(r => r.scrollLeft); renderPicker(); document.querySelectorAll('#pickFilters .frow').forEach((r, i) => r.scrollLeft = sl[i]); }
      break; }
    case 'openItem': push({ type:'item', id }); break;

    case 'back': pop(); break;
    case 'odLayout': ui.odLayout = el.dataset.v; refresh(); break;
    case 'plus': actionSheet('', [
      { label:'添加衣物', fn:() => openItemEditor() },

    case 'settings': openMenu(); break;
    case 'exportBackup': exportBackup(); break;

/* ---------- menu: backup / sample / clear ---------- */
const DAY = 86400000;
const realItems = () => db.items.filter(x => !x.sample);
const hasSample = () => db.items.some(x => x.sample) || db.outfits.some(o => o.sample);
function fmtDateTime(ts){ const d = new Date(ts), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function backupText(){
  if (!meta.lastBackup) return '上次备份：从未备份';
  const days = Math.floor((Date.now() - meta.lastBackup) / DAY);
  return '上次备份：' + fmtDateTime(meta.lastBackup) + (days >= 1 ? '（' + days + ' 天前）' : '（今天）');
}
function backupDue(){
  const real = realItems(); if (!real.length) return 0;
  const ref = meta.lastBackup || Math.min.apply(null, real.map(x => x.createdAt || Date.now()));
  const days = Math.floor((Date.now() - ref) / DAY);
  if (days < 14 || (meta.snoozeUntil && Date.now() < meta.snoozeUntil)) return 0;
  return days;
}
function reminderHTML(){
  const days = backupDue(); if (!days) return '';
  return '<div class="remind"><span class="tx">' + (meta.lastBackup ? '已经 ' + days + ' 天没有备份了。' : '你还没有备份过。') + '数据只保存在这台手机上，建议导出一份备份。</span>' +
    '<button data-act="exportBackup">立即备份</button><button class="later" data-act="snooze">稍后</button></div>';
}
function openMenu(){
  const acts = [
    { label:'导出备份', fn:exportBackup },
    { label:'导入备份', fn:() => { const inp = $('#importInput'); inp.value = ''; inp.click(); } },
    hasSample() ? { label:'删除示例数据', fn:() => setTimeout(confirmRemoveSample, 320) } : { label:'载入示例数据', fn:() => setTimeout(confirmLoadSample, 320) },
    { label:'清空全部数据', danger:true, fn:() => setTimeout(confirmClear1, 320) }
  ];
  actionSheet('我的衣橱 · 版本 ' + APP_VERSION + '<br>' + db.items.length + ' 件衣物 · ' + db.outfits.length + ' 套搭配<br><b>' + backupText() + '</b><br><small>数据只保存在这台设备上（不上传、不同步），请定期导出备份</small>', acts);
}
function confirmLoadSample(){
  actionSheet(db.items.length ? '将 17 件示例衣物和 7 套示例搭配<b>添加</b>到你的衣橱中（不会删除你已有的数据）。之后可在 ⋯ 中一键删除示例数据' : '载入 17 件示例衣物和 7 套示例搭配，看看效果。之后可在 ⋯ 中一键删除', [

}
function confirmRemoveSample(){
  actionSheet('删除所有示例衣物和示例搭配？你自己添加的不受影响', [{ label:'删除示例数据', danger:true, fn:() => {
    const di = db.items.filter(x => x.sample).map(x => x.id), dout = db.outfits.filter(o => o.sample).map(o => o.id), set = new Set(di);
    db.items = db.items.filter(x => !x.sample); db.outfits = db.outfits.filter(o => !o.sample);

    persist({ delItems:di, delOutfits:dout, outfits:touched }); clearStack(); refresh(); toast('已删除示例数据'); } }]);

function confirmClear1(){
  actionSheet('清空全部数据？<br>将删除这台设备上的<b>所有衣物、搭配和照片</b>。建议先导出备份', [
    { label:'导出备份', fn:exportBackup },

}
function confirmClear2(){

    Store.replaceAll([], []).then(() => { db = { items:[], outfits:[] }; ui.wf = newFilter(); clearStack(); refresh(); toast('已清空'); }).catch(storageError); } }]);

// 导出：单个 JSON 文件（含全部图片）。iPhone 上优先用系统分享面板（可“存储到文件”/AirDrop/发给自己）
function exportBackup(){
  if (!db.items.length && !db.outfits.length) return toast('衣橱是空的，暂无可备份内容');
  const now = new Date(), p = n => String(n).padStart(2, '0');
  const name = 'wardrobe-backup-' + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + '-' + p(now.getHours()) + p(now.getMinutes()) + '.json';
  const payload = JSON.stringify({ app:'my-wardrobe', format:1, appVersion:APP_VERSION, exportedAt:now.toISOString(), items:db.items, outfits:db.outfits });
  const done = () => { Store.setMeta('lastBackup', Date.now()).then(() => renderWardrobe()).catch(() => {}); toast('备份已导出'); };
  let file = null;
  try { file = new File([payload], name, { type:'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.share && navigator.canShare({ files:[file] })) {
    navigator.share({ files:[file], title:'衣橱备份' }).then(done).catch(err => {
      if (err && err.name === 'AbortError') toast('已取消导出'); else download(payload, name, done);
    });
  } else download(payload, name, done);
}
function download(text, name, done){
  const url = URL.createObjectURL(new Blob([text], { type:'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000); done();
}
$('#importInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { return toast('无法读取：这不是有效的备份文件'); }
  if (!data || data.app !== 'my-wardrobe' || !Array.isArray(data.items) || !Array.isArray(data.outfits)) return toast('这不是衣橱的备份文件');
  const clean = normalizeData(data);
  setTimeout(() => actionSheet('用这份备份<b>替换</b>当前全部数据？<br>备份时间：' + (data.exportedAt ? fmtDateTime(Date.parse(data.exportedAt)) : '未知') + '<br>备份内容：' + clean.items.length + ' 件衣物、' + clean.outfits.length + ' 套搭配<br>当前数据（' + db.items.length + ' 件、' + db.outfits.length + ' 套）将被覆盖', [
    { label:'替换为备份数据', danger:true, fn:() => {
      Store.replaceAll(clean.items, clean.outfits).then(() => { db = clean; ui.wf = newFilter(); clearStack(); refresh(); toast('已从备份恢复 ' + clean.items.length + ' 件衣物'); }).catch(storageError); } }]), 100);
});
